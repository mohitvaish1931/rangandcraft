name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint --workspace=clothing-brand-frontend
      - name: Typecheck and build
        run: npm run build --workspace=clothing-brand-frontend

  backend:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports: ['27017:27017']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: API tests
        run: npm test --workspace=clothing-brand-backend
        env:
          MONGO_TEST_URI: mongodb://127.0.0.1:27017/rangandcraft_test
